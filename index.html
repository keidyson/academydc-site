<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecionando...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .message {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0081f2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #0081f2;
            text-decoration: none;
        }
    </style>
    <script>
        function redirectToLanguage() {
            let userLang = navigator.language || navigator.userLanguage;
            
            if (userLang.startsWith('pt')) {
                window.location.href = '/pt/';
            } else {
                window.location.href = '/en/';
            }
        }
        
        redirectToLanguage();
    </script>
</head>
<body>
    <div class="message">
        <div class="spinner"></div>
        <p>Redirecionando para a versão correta do site...</p>
        <p><small>Se não for redirecionado automaticamente, <a href="/pt/">clique aqui para Português</a> ou <a href="/en/">aqui para English</a>.</small></p>
    </div>
</body>
</html>
